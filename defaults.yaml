primary_device: 'cuda'
seed: 69
exp_details:
  data_root: data
  out_dir: /home/WVU-AD/jdt0025/Documents/exp/CHASE # Model + figure path
  exp_id:          # Optional suffix for autogenerated experiment names
  exist_ok: 1
  dataset: NACC
  sens_attr: sex # One of [sex, race]
data:
  drop_sex: 0
  drop_race: 0
  drop_educ: 0
train_params:
  epochs: 20 #20
  checkpoint: 100
  batch_size: 128
  loss_fn: 'DeepHit'  # NLL, DeepHit, MLTR
  reduction: 'mean'   # [sum, mean] --> Default: mean
  lambda: 1.0           # Ranking loss weight
model:
  backbone: mlp  # [resnet18, resnet50, vit]
  in_dim: 96            # For nonimaging data, 86 for NACC data
  mlp_hid_dim: 128     # Mlp only
  pretrained_path: 
optimizer:
  optim: 'Adam'     # [SGD, Adam] --> Default: Adam
  lr: .0001  
  weight_decay: 0   # Usually 0
  momentum: 0       # Usually 0
  lr_scheduler: 
